<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Position Absolute and Relative-Exercises</title>
    <style>
        body {
            height: 2000px;
            margin-top: 50px;
            margin-left: 50px;
        }

        .cross {
            font-family: Arial, Helvetica, sans-serif;
            background-color: black;
            color: white;
            padding-left: 8px;
            padding-right: 8px;
            padding-top: 4px;
            padding-bottom: 4px;
            border-radius: 20px;
            position: absolute;
            right: 10px;
        }

        .box {
            height: 180px;
            width: 320px;
            background-color: gray;
            position: fixed;
            right: 10px;
            bottom: 14px;
            z-index: 100px;
        }

        .close-button {
            background-color: black;
            color: white;
            position: absolute;
            top: -18px;
            left: -18px;
            font-family: Arial;
            font-size: 20px;
            width: 45px;
            height: 45px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body>

    <div class="cross">
        X
    </div>


    <div class="box">
        <div class="close-button">
            X
        </div>
    </div>
</body>

</html>
