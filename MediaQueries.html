<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Queries</title>
    <STYLE>
        .box{
            background-color: red;
            font-size: 20px;
            text-align: center;
            display: none;
        }

        @media(max-width:375px){
           #box-1{
            display: block;
           }
        }

        @media(min-width:375px)and (max-width:414px){
            #box-2{
                display: block;
                background-color: yellowgreen;
            }
        }

        @media(min-width:414px) and (max-width:430px){
            #box-3{
                display: block;
                background-color: lightcyan;
            }
        }

        @media(min-width:430px) and (max-width:850px){
            #box-4{
                display: block;
                background-color: lightsalmon;
            }
        }

        @media (min-width:850px){
            #box-5{
                display: block;
                background-color: lightseagreen;
            }
        }

    </STYLE>
</head>
<body>
    <div class="box" id="box-1">iphone SE</div>
    <div class="box" id="box-2">iphone Xr</div>
    <div class="box" id="box-3">iphone 12pro</div>
    <div class="box" id="box-4">iphone 14pro max</div>
    <div class="box" id="box-5"> mac-book </div>
</body>
</html>
