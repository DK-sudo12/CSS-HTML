<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div-Element</title>
    <style>
        .red {
            width: 100px;
            height: 100px;
            background-color: red;
            display: inline-block;
        }

        .green {
            width: 100px;
            height: 100px;
            background-color: green;
            border-radius: 200px;
            display: inline-block;
        }

        .statement{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
        }

        .review{
         
          display: inline-block;
          border-width: 1px;
          width:300px;
          height: 98px;
          border: 2px;
          padding-left: 15px;
          border-style:solid ;
          border-color: rgb(150, 150, 150);
        }
        .yt{
            height: 120px;
            width: 370px;
            padding-left: 15px;
            background-color: rgb(37, 37, 37);
        }
        .direction{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
            font-weight: bold;
            color: white;
            padding-top: 20px;
            margin-bottom: 0px;
        }  
        .navication{
            color: rgb(155, 155, 155);
            font-family: Arial, Helvetica, sans-serif;

        } 
    </style>
</head>

<body>
    <div class="red"></div>

    <div class="green"></div>
     <hr>    
    <div class="review">
        <p class="statement">
            Satisfied with our service?
        </p>
        <button class="yes">Yes</button>
        <button class="No">No</button>
    </div>
    <br>
    <div class="yt">
         <p class="direction">Install YouTube Music<p>
         <p class="navication">Add YouTube Music to your desktop for quick and easy access</p>
    </div>
</body>

</html>
