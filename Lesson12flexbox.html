<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLEXBOX</title>
</head>
<body>
     <div style="display: flex; flex-direction: row;">
        <div style="background-color: lightblue; width: 200px;">200px</div>
        <div style="background-color: lightpink; width: 75px;">75px</div>
     </div>
     <div style="display: flex; flex-direction: row;margin-top: 5px;">
        <div style="background-color: lightblue; width: 50px;">item1</div>
        <div style="background-color: lightpink; flex: 1;">item2</div>
        <div style="background-color: lightblue; width: 50px;">item3</div>
     </div>
     <div style="display: flex; flex-direction: row;margin-top: 5px;
     justify-content: space-between; border-style: solid;">
        <div style="background-color: lightpink;">item1</div>
        <div style="background-color: lightpink;">item2</div>
        <div style="background-color: lightpink;">item3</div>
        <div style="background-color: lightpink;">item4</div>
     </div>
     <div style="display: flex; flex-direction: row;margin-top: 5px;
     justify-content: space-between; border-style: solid; align-items: center; height: 50px;
    border-width: 1px; border-color: gray;">
        <div style="background-color: lightpink;justify-content: start;">item1</div>
        
        <div style="background-color: lightpink;justify-content: end;">item2</div>
     </div>
</body>
</html>
