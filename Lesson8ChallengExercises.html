<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign up form</title>
    <style>
        .email {
            display: block;
            margin-top: 7px;
            padding-right: 50px;
            padding-top: 5px;
            padding-bottom: 5px;
            margin-bottom: 5px;
            border-radius: 5px;
            border-width: 1px;
        }

        .first-name {
            width: 102.5px;
            padding-top: 5px;
            padding-bottom: 5px;
            border-radius: 5px;
            border-width: 1px;
        }

        .last-name {
            width: 102.5px;
            padding-top: 5px;
            padding-bottom: 5px;
            border-radius: 5px;
            border-width: 1px;
        }

        .sing-up {
            border-radius: 5px;
            background-color: rgb(0, 89, 255);
            color: white;
            border: none;
            padding-top: 7px;
            padding-bottom: 7px;
            display: flex;
            margin-left: 0px;
            padding-left: 86px;
            padding-right: 86px;
        }

        .uber {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 35px;
            margin-bottom: 20px;
        }

        .box1 {
            display: block;
            margin-bottom: 7px;
            background-color: rgba(128, 128, 128, 0.13);
            border: none;
            padding-left: 15px;
            padding-right: 150px;
            padding-top:  8px;
            padding-bottom: 8px;
        }

        .box2 {
            display: block;
            margin-bottom: 20px;
            background-color: rgba(128, 128, 128, 0.13);
            border: none;
            padding-left: 15px;
            padding-right: 150px;
            padding-top: 8px;
            padding-bottom: 8px;
        }
        .request-box{
            font-family: Arial, Helvetica, sans-serif;
            background-color: black;
            color:white;
            border: none;
            padding-top: 8px;
            padding-bottom: 8px;
            padding-left: 15px;
            padding-right: 15px;
        }
        .time-set{
            font-family: Arial, Helvetica, sans-serif;
            border: none;
            padding-top: 8px;
            padding-bottom: 8px;
            padding-left: 15px;
            padding-right: 15px;
        }
    </style>
</head>

<body>
    <input class="first-name" type="text" placeholder="First name">
    <input class="last-name" type="text" placeholder="Last name">
    <input class="email" type="text" placeholder="Email">
    <button class="sing-up">Sing Up</button>
    <hr>
    <p class="uber">Request a ride now</p>
    <input class="box1" type="text" placeholder="Enter pickup location">
    <input class="box2" type="text" placeholder="Enter destination">
    <button class="request-box">Request now</button>
    <button class="time-set">Schedule for later</button>
</body>

</html>
