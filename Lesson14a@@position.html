<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-position practices</title>
    <style>
        .rock {
            background-color: black;
            color: white;
            position: fixed;

        bottom-right
    </div>
