<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="To boost you shoping expericence and top quality of cloth connect with amazone">
    <title>Online Shopping site in india</title>
    <link rel="shortcut icon" href="Bokehlicia-Pacifica-Amazon.256.png" type="image/x-icon">
    <style>
        .link {
            color: rgb(0, 113, 133);
            transition: 0.15;
        }
        .link:hover{
            color: rgb(211, 140, 10);
        }

        .price {
            color: rgb(0, 118, 0);
            font-weight: bold;

        }

        .delivery {
            margin-top: 18px;
            font-style: inherit;
        }

        .cart {
            background-color: rgb(255, 216, 20);
            border: none;
            height: 25px;
            width: 105px;
            border-radius: 20px;
            margin-top: 19px;
            cursor: pointer;
            transition: 0.15;
        }
        .cart:hover{
            background-color: rgb(250, 204, 0);
        }
        .cart:active{
            opacity: 0.5;
        }

        .buy {
            background-color: rgb(255, 164, 28);
            border: none;
            height: 25px;
            width: 105px;
            border-radius: 20px;
            margin-left: 5px;
            cursor: pointer;
            transition: 0.15;
        }
        .buy:hover{
            background-color: rgb(212, 139, 3);
        }
        .buy:active{
            opacity:0.5;
        }

    </style>
</head>

<body>
    <div><a class="link"
            href="https://www.amazon.in/?&tag=googhydrabk1-21&ref=pd_sl_5szpgfto9i_e&adgrpid=155259813593&hvpone=&hvptwo=&hvadid=674893540034&hvpos=&hvnetw=g&hvrand=6430245853450941190&hvqmt=e&hvdev=c&hvdvcmdl=&hvlocint=&hvlocphy=9150391&hvtargid=kwd-64107830&hydadcr=14452_2316413&gad_source=1"
            target="_blank">Back to Amazon</a>
    </div>

    <div class="shoes">
        <h2>Nike Black Running Shoes</h2>
    </div>

    <div class="price">
        <span>$39 - in stock.</span>
    </div>

    <div class="delivery">
        <span>Free delivery tomorrow.</span>
    </div>

    <div>
        <button class="cart">Add to Cart</button>
        <button class="buy">Buy now</button>
    </div>

</body>

</html>
