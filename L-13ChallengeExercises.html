<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lesson13</title>
    <style>
        p {
            margin: 0px;
            font-family: Arial, Helvetica, sans-serif;
            display: inline-block;
        }

        .flexbox {
            display: flex;
            flex-direction: row;
            margin-bottom: 20px;
            max-width: 600px;
        }

        .profile-img {
            display: flex;
            align-items: center;
        }

        .info-box {
            margin-left: 8px;
        }

        .img1 {
            width: 50px;
            height: 50px;
            object-fit: cover;
            object-position: center;
            border-radius: 30px;
        }

        .prompt {
            display: flex;
            flex: 1;
            margin-bottom: 0px;
        
        }

        .rot {
            font-weight: bold;
            margin-bottom: 2px;
        }

        .text {
            display: flex;
            flex: 1;
            margin-top: 5px;
        }

        .alert {
            color: gray;
            font-size: 14px;
        }

        .time {
            font-family: Arial, Helvetica, sans-serif;
            color: gray;
            display: inline-block;
        }

        .head {
            margin-bottom: 15px;
        }

        .headop {
            color: gray;
            font-size: 14px;
        }
        .blud{
            font-weight: bold;
             font-size: 15px;
        }
    </style>
</head>

<body>
    <header>
        <DIV class="head">
            <P class="headop">ALL INBOXES</P>
        </DIV>
    </header>
    <main>
        <div class="flexbox">
            <div class="profile-img">
                <img class="img1" src="MainBefore.jpg">
            </div>

            <div class="info-box">
                <div class="prompt">
                    <p class="rot">Chewy Promotions </p>
                </div>

                <div class="prompt2">
                    <p class="blud">Biggest sales of the year!</p>
                </div>

                <div class="text">
                    <p class="alert">Hey there We're writing to tell you about our...</p>
                </div>
            </div>



            <div class="time">
                4:58 PM
            </div>
        </div>

        <div class="flexbox">
            <div class="profile-img">
                <img class="img1" src="CSS/dog.jpg">
            </div>

            <div class="info-box">

                <div class="prompt">
                    <p class="rot">Best Buy</p>   
                </div>

                <div class="prompt2">
                    <p class="blud">Your Best Buy eReceipt</p>
                </div>

                <div class="text">
                    <p class="alert">Thanl you for shopping at Best Buy, here is...</p>
                </div>
            </div>



            <div class="time">
                12:32 PM
            </div>

        </div>

        <div class="flexbox">
            <div class="profile-img">
                <img class="img1" src="CSS/61eo0WHaqzL.jpg">
            </div>

            <div class="info-box">

                <div class="prompt">
                    <p class="rot">Netflix</p>
                </div>
   
                <div class="prompt2">
                    <p class="blud">Your Best Buy eReceipt</p>
                </div>  
                          
                <div class="text">
                    <p class="alert">Brand new movies and shows, old favroites...</p>
                </div>
            </div>



            <div class="time">
                9:00 AM
            </div>

        </div>


    </main>
</body>

</html>
