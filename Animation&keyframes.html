<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation&Keyframes</title>
</head>
<style>
    body {
        background-color: black;
    }

    .box {
        height: 50px;
        width: 0%;
        position: relative;
        background-color: lightgreen;
        animation-name: move1;
        animation-duration: 2s;
        animation-iteration-count: 2;
        animation-fill-mode: alternate;
        animation-timing-function: ease-in;
        box-shadow: 5px 5px 50px yellow;
    }

    @keyframes move1 {
        from {
            width: 0px;
        }

        to {
            width: 100%;
        }
    }

    .Container {
        background-color: black;
        border-style: solid;
        border-color: white;
        color: aliceblue;
        text-align: center;

    }

    .box2 {
        height: 200px;
        width: 250px;
        position: relative;
        background-color: lightgreen;
        animation-name: move;
        animation-duration: 2s;
        animation-iteration-count:2;
        animation-fill-mode: alternate;
        animation-direction: reverse;

    }

    @keyframes move {
        0% {
            top: 0px;
            left: 0px;
            box-shadow: 5px 5px 50px yellow;
        }

        25% {
            top: 200px;
            left: 0px;
            box-shadow: 5px 5px 50px yellow;
        }

        75% {
            top: 200px;
            left: 250px;
            box-shadow: 5px 5px 50px yellow;
        }

        100% {
            top: 0px;
            left: 250px;
            box-shadow: 5px 5px 50px yellow;
        }
    }

    .Container2 {
        margin-top: 50px;
        background-color: black;
        border-style: solid;
        border-color: white;
        color: aliceblue;
        text-align: center;
        height: 400px;
        width: 500px;

    }
</style>

<body>
    <div class="Container">
        <div class="box"></div>
    </div>
    <div class="Container2">
        <div class="box2"></div>
    </div>
</body>

</html>
