<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text and style</title>
    <style>
        
       
        p{
            font-family: Arial;
        }
        .title {
            font-weight: bold;
            font-size: 18px;
            width: 280px;
            line-height: 24px;
            margin-bottom: 0px;
            margin-top: 0px;
        }
        
        .stats {
            color: rgb(96, 96, 96);
            font-size: 14px;
            margin-bottom: 0px;
            margin-top: 5px;
        }
        

        .text {
            color: rgb(96, 96, 96);
            font-size: 14px;
            margin-top: 20px;
            margin-bottom: 0px;
        }

        .peragraph {
            
            color: rgb(96, 96, 96);
            font-size: 14px;
            width: 280px;
            margin-top: 20px;
            margin-bottom: 0px;
        }

        .appletext{
            margin-top: 0px;
            background-color: rgb(227, 65, 64);
            color: white;
            padding-top:15px ;
            padding-bottom: 15px;
            font-size: 14px;
            padding-left: 18px;
            padding-right: 18px;
            padding-top: 18px;
            padding-bottom: 18px;
           text-align: center;
           margin-bottom: 150px;
           margin-top: 10px;
        }

        .design{
            color: white;
            cursor: pointer;
            transition: 0.15;

        }
        .design:hover{
            text-decoration: underline;
        }

        .youtube{
            margin-top: 50px;
        }
        .apple{
            margin-top: 80px;
            color: gray;
        }

    </style>
</head>

<body>
    <div class="youtube"><img src="social-06-512.webp" alt="youtube-logo" height="25px" ></div>
    <p class="title">Talking Tech and AI with Google CEO Sundar Pichai!</p>
    <p class="stats">3.4M views &middot; 6 months ago</p>
    <p class="text">Marques Borwnlee &check; </p>
    <p class="peragraph">Talking tech and AI on the heels of Google I/O. Also a daily driver phone reveal from Google's
        CEO. Shoutout to
        Sundar!</p>
    <div class="apple"><img src="Apple_logo_grey.svg - Copy.png" alt="Apple-logo" height="20px"></div>    
    <p class="appletext"> Shop early for the best selection of holiday favourites. <span class="design">Shop now &gt;</span> </p>
</body>

</html>
