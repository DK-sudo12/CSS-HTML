<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lesson 9</title>
    <style>
        .tweet-box {
           
            vertical-align: middle;
            width: 330px;
           
            border-radius: 7px;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.281);
        }

        .image2 {
            width: 50px;
            height: 50px;
            object-fit: cover;
            object-position: center;
            border-radius: 6000px;
            vertical-align: middle;
            
        }

        .text {
            font-size: 15px;
            border: none;
        }
        .tweet-button{
            background-color: rgb(29, 155, 240);
            border: none;
            color: white;
            padding-top: 5px;
            padding-bottom: 5px;
            padding-left: 10px;
            padding-right: 10px;
            border-radius: 20px;
            font-size: 15px;
        }

        .facebook1{
            box-shadow: 3px 3px 6px rgba(0, 0, 0, 0.247);
            width: 150px;
            display: inline-block;
            
        }

        .oliver{
            width: 150px;
            height: 140px;
            object-fit: cover;
            object-position: center;
        }

        .name1{
            font-family: Arial, Helvetica, sans-serif;  
            font-weight: bold;
            margin-left: 5px;
            margin-bottom: 0px;
        }

        .mutual-friend{
            font-family: Arial, Helvetica, sans-serif;
            margin-left: 5px;
            margin-top: 5px;
            color: rgb(150,150,150);
        }
        button{
            background-color: rgb(0, 89, 255);
            color: rgb(231, 231, 231);
            border: none;
            border-radius: 3px;
            padding-top: 5px;
            padding-bottom: 5px;
            margin-bottom: 10px;
            margin-left: 5px;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.116);
        }
        
        .facebook2{
            box-shadow: 3px 3px 6px rgba(0, 0, 0, 0.247);
            width: 150px;
            display: inline-block;
            margin-left: 10px;
            
        }
        .facebook3{
            box-shadow: 3px 3px 6px rgba(0, 0, 0, 0.247);
            width: 150px;
            display: inline-block;
            margin-left: 10px;
            
        }

    </style>
</head>

<body>
    <div class="tweet-box">
            <img class="image2" src="MainBefore.jpg" alt="">
            <input class="text" type="text" placeholder="What's happening?">
            <button class="tweet-button">Tweet</button>
        </div>
        <hr>

        <div class="facebook1">
            <img class="oliver" src="MainBefore.jpg">
            <p class="name1">Oliver</p>
            <p class="mutual-friend">2 mutual friend</p>
            <button>
                Add Friend
            </button>
        </div>

        <div class="facebook2">
            <img class="oliver" src="cathtml.jpg">
            <p class="name1">Mimi</p>  
            <p class="mutual-friend">3 mutual friend</p> 
            <button>
                Add Friend
            </button>
        </div>

        <div class="facebook3">
            <img class="oliver" src="dog.jpg">
            <p class="name1">Rex</p>  
            <p class="mutual-friend">4 mutual friend</p> 
            <button>
                Add Friend
            </button>
        </div>
</body>

</html>
