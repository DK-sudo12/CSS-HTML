<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Click</title>
    <style>
        button{
            background-color: green;
            border: none;
            color: white;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 5px;
            padding-bottom: 5px;
            cursor: pointer;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.479);
        }
        
        button:active{
            margin-top:3px;
            margin-left: 3px;
            opacity: 0.5;
            box-shadow: none;
        }
    </style>
</head>
<body>
    <button>Shadow</button>
</body>
</html>
