<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Practies Set2</title>
    <style>
        .request-button {
            background-color: black;
            color: white;
            border: none;
            height: 45px;
            width: 124px;
            font-size: 13px;
            cursor: pointer;
            transition: 0.15s;
        }

        .request-button:hover {
            opacity: 0.8;
        }

        .addtocart-button {
            background-color: rgb(255, 216, 20);
            border: NOne;
            height: 35px;
            width: 160px;
            border-radius: 20px;
            margin-left: 8px;
            font-size: 15px;
            cursor: pointer;
            transition: 0.15s;
        }

        .addtocart-button:hover {
            background-color: rgb(250, 204, 0);
        }

        .signup-button {
            background-color: rgb(45, 164, 79);
            color: white;
            border: none;
            height: 35px;
            width: 105px;
            border-radius: 5px;
            margin-left: 8px;
            cursor: pointer;
            transition: 0.15s;
        }

        .signup-button:hover {
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.3);
        }

        .bootstrap {
            background-color: rgb(121, 82, 179);
            color: white;
            border: None;
            height: 38px;
            width: 110px;
            border-radius: 3px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
            margin-right: 8px;
            transition: 0.15s;
        }

        .bootstrap:hover {
            background-color: rgb(68, 36, 116);
        }

        .download {
            background-color: white;
            color: rgba(61, 64, 66, 0.747);
            height: 38px;
            width: 110px;
            border-width: 1px;
            border-color: rgb(108, 117, 125);
            border-radius: 3px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
        }

        .download:hover{
            background-color: rgb(108, 117, 125);
            color: white;
        }

        .linkedin-button {
            background-color: rgb(38, 109, 240);
            color: white;
            border: none;
            height: 40px;
            width: 220px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.15s;
        }

        .linkedin-button:hover{
            background-color: rgb(10, 67, 172);
        }


        .save {
            background-color: white;
            color: rgb(10, 102, 194);
            border-width: 1.3px;
            height: 40px;
            width: 90px;
            border-radius: 20px;
            border-color: rgb(10, 102, 194);
            font-weight: bold;
            margin-left: 8px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.1s;
        }
        .save:hover{
            background-color: rgba(73, 166, 253,0.164);
            border-width: 2px;
        }
    </style>
</head>

<body>
    <button class="request-button">Request now</button>
    <button class="addtocart-button">Add to Cart</button>
    <button class="signup-button">Sign up</button>
    <br>
    <div>
        <button class="bootstrap">Get started</button>
        <button class="download">Download</button>
    </div>
    <br>
    <div>
        <button class="linkedin-button">Apply on company website</button>
        <button class="save">Save</button>
    </div>

</body>

</html>
