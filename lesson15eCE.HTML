<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>position Absolute and Relative</title>
    <style>
        .container {

            height: 400px;
            width: 300px;
        }

        .t-shirtpic {
            height: 400px;
            width: 400px;
            object-fit: contain;
            object-position: center;

        }

        .picture {
            display: flex;
            position: relative;
            height: 400px;
            width: 300px;
        }

        .offer {
            background-color: black;
            color: white;
            position: absolute;
            top: 10px;
            right: 0px;
            padding-left: 10px;
            padding-right: 10px;
            padding-top: 7px;
            padding-bottom: 7px;
            font-family: Arial, Helvetica, sans-serif;
        }

        .sub-container{
            position: absolute;
            background-color: rgba(255, 255, 255, 0.726);
            width: 300px;
            height: 150px;
            /* top: 0px; */
            bottom: 0px;
            left: 0px;
            right: 0px;
            display: flex;
            justify-content:center;
            align-items: center;
        }

        .add{
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 15px;
            padding-right: 15px;
            font-size: 20px;
            cursor: pointer;
        }
        .add:hover{
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 15px;
            padding-right: 15px;
            font-size: 20px;
            cursor: pointer;
            display: block;
            box-shadow: inset 2px 2px 5px rgba(253, 1, 1, 0.349);
            filter: drop-shadow(0 0 10px #d38808);
        }

    </style>
</head>

<body>
    <div class="container">
        <div class="picture">
            <img class="t-shirtpic" src="CSS/black_e4d19185-c19d-4e7c-a14a-8d2a29c7bad3.webp">
            <div class="offer">
                20% OFF
             </div>  
                    <div class="sub-container">
                        <button class="add">Add to Cart</button>
                    </div>
           
        </div>
    </div>
</body>

</html>
