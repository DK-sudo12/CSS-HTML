<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="css-3.png" type="image/x-icon">
    <title>Text Style</title>
    <style>
        .Tahoma {
            font-family: tahoma;
            font-size: 55px;
            font-weight: bold;
        }

        .Arial {
            font-family: Arial;
            font-size: 55px;
            font-weight: bold;
            width: 700px;
        }

        .text1{
            font-size: 30px;
            color: red;
            font-family: Arial, Helvetica, sans-serif;
            font-style: italic;
            width: none;
        }
        .verdana1{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-weight: bold;
            font-size: 35px; 
            margin-bottom: 7px;
        }
        .verdana2{
            margin-top: 0px;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 30px;
            color: rgb(100, 100, 100);
        }
        .main{
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 28px;
            width: 500px;
        }
        button{
            background-color: green;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 25px;
            color: white;
            border: none;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 20px;
            padding-right: 20px;
            border-radius: 10px;
        }
        .title{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 45px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 0px;
        }
        .subtitle{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 25px;
            text-align: center;
            margin-bottom: 0px;
        }
        .footer{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 25px;
            color: rgba(59, 121, 255, 0.952);
            text-align: center;
            cursor: pointer;
            transition: 0.15s;
        }
        .footer:hover{
            text-decoration: underline;
        }

    </style>
</head>

<body>
    <p class="Tahoma">This is Tahoma Font</p>
    <hr>
    <p class="Arial">Biggest Deal of the Year! <span class="text1">Sale end Tuesday</span></p>
    <hr>
    <p class="verdana1">HTML CSS Course</p>
    <p class="verdana2">Beginner to Pro</p>

    <p class="main">In this Course, we'll learn the skills
        you need to become a developer.
    </p>
    <div>
        <button>Get started</button>
    </div>
    <hr>
    <p class="title">Shopping for your business?</p> 
    <p class="subtitle">See how Apple at Work can help.</p>
    <p class="footer">Learn more &gt;</p>
</body>

</html>
