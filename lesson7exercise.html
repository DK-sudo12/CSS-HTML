<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .image{
            width: 300px;
            border-radius: 20px;
        }
        .image1{
            width: 300px;
            height: 300px;
            object-fit: cover;
            object-position: center;
        }
        .image2{
            width: 300px;
            height: 300px;
            border-radius: 200px;
            object-fit: cover;
            object-position: center;
        }
    </style>
    
</head>
<body>
    <img class="image" src="MainBefore.jpg">
    <img class="image1" src="MainBefore.jpg">
    <img class="image2" src="MainBefore.jpg">
</body>
</html>
