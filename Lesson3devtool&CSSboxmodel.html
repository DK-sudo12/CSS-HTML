<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pagination</title>
    <style>
        .container{
            display: flex;
            justify-content: center;
            padding: 20px;
        } 
        .pagination{
            display: flex;
            list-style: none;
        }
        .pagination li{
            margin: 5px;
        }
    </style>

</head>
<body>
    <div class="container">
        <ul class="pagination">
            <li><button>Back</button></li>
            <li><a href="https://music.youtube.com/" target="_blank">1</a></li>
            <li><a href="https://github.com/" target="_blank">2</a></li>
            <li><a href="https://supersimple.dev/exercises/buttons/" target="_blank">3</a></li>
            <li><a href="https://www.khanacademy.org/" target="_blank">4</a></li>
            <li><a href="https://en.cppreference.com/w/cpp/language/operator_precedence" target="_blank">5</a></li>
            <li><button>Next</button></li>
        </ul>

    </div>
    
</body>
</html>
