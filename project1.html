<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sale</title>
    <style>
        body{
            background-color: black;
        }
        .container{
           font-family: Arial, Helvetica, sans-serif; 
           font-size: 50px;
           font-weight: bold;
           position: relative;
           width: 400px;
           text-align: center;
           margin: 200px;
        }

        .container::after{
            content: "";
            text-align: center;
            position: absolute;
            background: linear-gradient(to right, blue,purple,red) ;
            box-shadow: ;
            height: 100%;
            width: 100%;
            left: -1px;
            animation-name: amazone;
            animation-duration: 2s;
            animation-fill-mode: forwards;
            animation-iteration-count: infinite;
            z-index: -1;
        }

        @keyframes amazone{
            from{
                width: 0%;
                box-shadow: 10px 10px 50px blue,-10px -10px 50px red;
            }

            to{
                width: 100%;
                box-shadow: 10px 10px 50px blue,-10px -10px 50px red;
            }
        }
    </style>
</head>
<body>
    <div class="container">
         SALE IS LIVE...
    </div>
</body>
</html>
