<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transformation</title>
    <style>
        *{
            margin: 0px;
        }
        .Container{
            background-color: burlywood;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 500px;
        }

        .box{
            background-color: brown;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 200px;
            height: 200px;
            cursor: pointer;
            transition: 1s;
            transition-timing-function: ease-in;
        }

        .box:hover{
            /* transform: rotate(360deg); */
            /* transform: scale(2); */
            transform: skew(-20deg);
            /* transform: translateX(120px); */
            /* transform: translateY(120px); */
           
        }
    </style>
</head>
<body>
    <div class="Container">
        <div class="box">
           Transition
        </div>
    </div>
    
</body>
</html>
