<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stretch</title>
    <style>
        button{
            background-color: green;
            color:white;
            border: none;
            padding-left: 10px;
            padding-right: 10px;
            padding-bottom: 5px;
            padding-top: 5px;
            transition: 0.15;
            cursor: pointer;
           }
        button:hover{
            padding-left: 15px;
            padding-right: 15px;
            padding-bottom: 10px;
            padding-top: 10px;
        }
        
        
    </style>
</head>

<body>
    <div>
        <button>Stretch</button>
    </div>
    

</body>

</html>
