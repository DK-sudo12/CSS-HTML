<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lesson 9</title>
    <style>

        .facebook1 {
            box-shadow: 3px 3px 6px rgba(0, 0, 0, 0.247);
            width: 150px;
            

        }

        .oliver {
            width: 150px;
            height: 140px;
            object-fit: cover;
            object-position: center;
        }

        .name1 {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            margin-left: 5px;
            margin-bottom: 3px;
        }

        .mutual-friend {
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            margin-left: 5px;
            margin-top: 5px;
            color: rgb(150, 150, 150);
        }

        button {
            background-color: rgb(0, 89, 255);
            color: rgb(231, 231, 231);
            border: none;
            border-radius: 3px;
            padding-top: 5px;
            padding-bottom: 5px;
            margin-bottom: 10px;
            margin-left: 5px;
            box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.116);
        }

        .facebook2 {
            box-shadow: 3px 3px 6px rgba(0, 0, 0, 0.247);
            width: 150px; 
        }

        .facebook3 {
            box-shadow: 3px 3px 6px rgba(0, 0, 0, 0.247);
            width: 150px;

        }

        .pig-image {
            width: 30px;
            border-radius: 20px;
        }

        .frriend {
            display: grid;
            grid-template-columns: 30px 1fr;
        }

        .bigg-gridcss{
            display: grid;
            grid-template-columns: 170px 170px 170px;
            column-gap: 1px;

        }
    </style>
</head>

<body>

    <div class="bigg-gridcss">

        <div class="facebook1">
            <div class="profile-image">
                <img class="oliver" src="MainBefore.jpg">
            </div>
            <div class="id-name">
                <p class="name1">Oliver</p>
            </div>
            <div class="frriend">
                <img class="pig-image" src="61eo0WHaqzL.jpg">
                <p class="mutual-friend">2 mutual friends</p>
            </div>
    
            <button>
                Add Friend
            </button>
        </div>
    
        <div class="facebook2">
    
            <div>
                <img class="oliver" src="cathtml.jpg">
            </div>
    
            <div>
                <p class="name1">Mimi</p>
            </div>
    
            <div class="frriend">
                <img class="pig-image" src="61eo0WHaqzL.jpg">
                <p class="mutual-friend">3 mutual friends</p>
            </div>
    
            <div>
                <button>
                    Add Friend
                </button>
            </div>
        </div>
    
        <div class="facebook3">
            <div>
                <img class="oliver" src="dog.jpg">
            </div>
            <div>
                <p class="name1">Rex</p>
            </div>
            <div class="frriend">
                <img class="pig-image" src="61eo0WHaqzL.jpg">
                <p class="mutual-friend">4 mutual friends</p>
            </div>
            <div>
                <button>
                    Add Friend
                </button>
            </div>
        </div>
    </div>

    
</body>

</html>
