<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS-Grid</title>
    <style>
       .elevenc{
          display: grid;
          grid-template-columns: 1fr 1fr 1fr 1fr;
          column-gap: 20px; 
          row-gap: 10px;
       }
       .fm{
        background-color: lightpink;
       }
    </style>
</head>

<body>
    <div style="display: grid; grid-template-columns: 200px 75px; row-gap: 10px;">
        <div style="background-color: lightblue;">200px</div>
        <div style="background-color: lightpink">75px</div>
    </div>
    <br>
    <div style="display: grid; grid-template-columns: 50px 1fr 75px;
    row-gap:10px;">
        <div style="background-color: lightblue;">col1</div>
        <div style="background-color: lightpink">col2</div>
        <div style="background-color: lightblue;">col3</div>
    </div>
    <br>
    <div class="elevenc">
        <div class="fm">col1</div>
        <div class="fm">col2</div>
        <div class="fm">col3</div>
        <div class="fm">col4</div>
        <div class="fm">col1</div>
        <div class="fm">col2</div>
        <div class="fm">col3</div>
        <div class="fm">col4</div>
    </div>
</body>

</html>
