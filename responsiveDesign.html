<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>em/rem</title>
    <style>
         body{
           height:10000px ; 
         }
        html{
            font-size: 100px;
        }
         .container{
            font-size: 100px;
            border-style: solid;
            height: 1000vh;
            width: 100vw;
         }
        #dot{
            font-size: 3em;
        }

        #itf{
            font-size: 5rem;
        }

    </style>
</head>
<body>
    <div class="container">
         <h1 id="dot">School is good but it's a rat trap</h1>
         <h2 id="itf">hello world</h2>
    </div>
</body>
</html>
